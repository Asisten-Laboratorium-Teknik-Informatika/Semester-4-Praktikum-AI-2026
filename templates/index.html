<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penerjemah Bahasa Isyarat AI</title>
    <style>
        :root {
            --bg-color: #f8f9fc;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #6c757d;
            --accent-green: #10b981;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header-title {
            margin-bottom: 5px;
            font-weight: 700;
            font-size: 32px;
            letter-spacing: -0.5px;
        }

        .header-subtitle {
            color: var(--text-muted);
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 40px;
            letter-spacing: 0.5px;
        }

        .container {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(149, 157, 165, 0.15); 
            max-width: 680px;
            width: 100%;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .video-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            margin-bottom: 24px;
            background-color: #000; 
            line-height: 0; 
        }

        .video-feed {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 16px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-color);
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dot {
            width: 12px;
            height: 12px;
            background-color: var(--accent-green);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
            70% { box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .status-icon {
            color: var(--text-muted);
            font-weight: normal;
        }

        .footer {
            margin-top: auto;
            padding-top: 40px;
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.8;
            text-align: center;
        }

        .footer strong {
            color: var(--text-main);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1 class="header-title">Penerjemah Isyarat AI</h1>
    <p class="header-subtitle">Sistem Deteksi Real-Time Berbasis Deep Learning</p>

    <div class="container">
        <div class="video-wrapper">
            <img src="{{ url_for('video_feed') }}" class="video-feed" width="640" height="480" alt="Kamera AI Sedang Memuat...">
        </div>
        
        <div class="status-bar">
            <div class="status-indicator">
                <span class="dot"></span>
                <span>Sistem & Suara Aktif</span>
            </div>
            <span class="status-icon">🔊 Volume Maksimal</span>
        </div>
    </div>

    <div class="footer">
        <strong>Praktikum AI — Kelompok A2</strong><br>
        Adeptri Sagala | Kabul Manik | Peter Rangga Situmorang<br>
        D3 Teknik Informatika — Universitas Sumatera Utara
    </div>
</body>
</html>
